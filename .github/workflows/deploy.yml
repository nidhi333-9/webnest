name: Deploy to EC2

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull and redeploy
        run: |
          cd /home/ubuntu/webnest/frontend
          git pull origin main
          docker compose build --no-cache
          docker compose up -d
