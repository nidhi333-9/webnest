services:
  db:
    image: postgres:17

    container_name: webnest-db

    restart: always

    environment:
      POSTGRES_USER: techynidhi
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: mydb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .

    container_name: webnest-app

    depends_on:
      - db

    ports:
      - "3000:3000"

    env_file:
      - .env

volumes:
  postgres_data:
